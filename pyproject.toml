[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dp-typing-master"
version = "2.0.0"
description = "Тренажёр слепой печати для русской и английской раскладки"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[project.scripts]
dp-typing-master = "dp_typing.app:main"

[tool.setuptools]
packages = ["dp_typing", "dp_typing.data"]

[tool.setuptools.package-data]
"dp_typing.data" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF"]
# RUF001-003 — «неоднозначные» кириллические буквы. Проект русскоязычный,
# кириллица в строках и комментариях намеренная.
ignore = ["E203", "RUF001", "RUF002", "RUF003"]
