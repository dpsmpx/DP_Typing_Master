name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff flake8
      - run: ruff check .
      - run: flake8 .

  test:
    # Python 3.9 is unavailable on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Виртуальный дисплей и Tk
        run: sudo apt-get update && sudo apt-get install -y xvfb libtk8.6 fonts-dejavu-core
      - run: pip install pytest
      - name: Тесты, включая интерфейс на настоящем Tk
        env:
          DP_REQUIRE_GUI: "1"
        run: xvfb-run -a python -m pytest -q

  windows-exe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build real Windows GUI executable
        shell: pwsh
        run: >-
          python -m PyInstaller --onefile --windowed
          --name DP_Typing_Master --collect-data dp_typing
          --noconfirm --clean DP_Typing_Master.py
      - name: Smoke test bundled executable on Windows
        run: python tools/smoke_exe.py dist/DP_Typing_Master.exe
      - name: Upload executable for PR testing
        uses: actions/upload-artifact@v4
        with:
          name: DP_Typing_Master-windows
          path: dist/DP_Typing_Master.exe
          if-no-files-found: error
          retention-days: 14
